name: CD

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: soupspoon.kr
  CLOUDFRONT_DOMAIN_NAME: d38on5u64c2dgq.cloudfront.net
  VITE_API_BASE: https://api.soupspoon.kr/api/v1
  VITE_GOOGLE_LOGIN_URL: https://api.soupspoon.kr/oauth2/authorization/google

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://${{ env.S3_BUCKET }} --delete

      - name: Resolve CloudFront distribution
        id: cloudfront
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?DomainName=='${{ env.CLOUDFRONT_DOMAIN_NAME }}'].Id | [0]" \
            --output text)

          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "CloudFront distribution not found for ${{ env.CLOUDFRONT_DOMAIN_NAME }}"
            exit 1
          fi

          echo "distribution_id=$DISTRIBUTION_ID" >> "$GITHUB_OUTPUT"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cloudfront.outputs.distribution_id }}" \
            --paths "/*"

      - name: Notify Discord (success)
        if: success()
        uses: fjogeleit/http-request-action@v1.14.0
        continue-on-error: true
        with:
          url: ${{ secrets.DISCORD_WEBHOOK }}
          method: "POST"
          customHeaders: |
            {
              "Content-Type": "application/json"
            }
          data: |
            {
              "embeds": [{
                "title": "🚀 배포 성공",
                "description": "프론트엔드가 성공적으로 배포되었습니다.",
                "color": 5814783,
                "fields": [
                  {
                    "name": "Repository",
                    "value": "`${{ github.repository }}`",
                    "inline": true
                  },
                  {
                    "name": "Branch",
                    "value": "`${{ github.ref_name }}`",
                    "inline": true
                  }
                ]
              }]
            }

      - name: Notify Discord (failure)
        if: failure()
        uses: fjogeleit/http-request-action@v1.14.0
        continue-on-error: true
        with:
          url: ${{ secrets.DISCORD_WEBHOOK }}
          method: "POST"
          customHeaders: |
            {
              "Content-Type": "application/json"
            }
          data: |
            {
              "embeds": [{
                "title": "❌ 배포 실패",
                "description": "배포 중 오류가 발생했습니다.",
                "color": 15158332,
                "fields": [
                  {
                    "name": "Repository",
                    "value": "`${{ github.repository }}`",
                    "inline": true
                  },
                  {
                    "name": "Branch",
                    "value": "`${{ github.ref_name }}`",
                    "inline": true
                  }
                ]
              }]
            }
